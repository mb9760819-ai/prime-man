<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prime Man Boutique</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

<style>
.logo{
height:120px;
object-fit:contain;
}
</style>

</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-light">
<div class="container">
<a class="navbar-brand fw-bold" href="#">Prime Man</a>
</div>
</nav>

<!-- HEADER WITH LOGO -->
<header class="bg-dark py-5 text-center">

<!-- ضع هنا صورة اللوغو -->
<img src="logo.png" class="logo">

</header>

<!-- PRODUCTS -->
<section class="py-5">
<div class="container">
<div class="row">

<!-- PRODUCT 1 -->
<div class="col-md-4">
<div class="card">

<img src="photo1.jpg" class="card-img-top">

<div class="card-body text-center">

<h5>Ensemble homme noir</h5>

<p>
<span class="text-muted text-decoration-line-through">4200DZD</span>
3500DZD
</p>

<button class="btn btn-dark" onclick="order('Ensemble homme noir')">
اطلب الآن
</button>

</div>
</div>
</div>

<!-- PRODUCT 2 -->
<div class="col-md-4">
<div class="card">

<img src="photo2.jpg" class="card-img-top">

<div class="card-body text-center">

<h5>Ensemble homme bleu</h5>

<p>
<span class="text-muted text-decoration-line-through">4200DZD</span>
3500DZD
</p>

<button class="btn btn-dark" onclick="order('Ensemble homme bleu')">
اطلب الآن
</button>

</div>
</div>
</div>

</div>
</div>
</section>

<!-- ORDER MODAL -->
<div class="modal fade" id="orderModal">
<div class="modal-dialog">
<div class="modal-content">

<div class="modal-header">
<h5>معلومات الطلب</h5>
</div>

<div class="modal-body">

<form id="orderForm">

<input type="hidden" id="product">

<div class="mb-2">
<input class="form-control" id="name" placeholder="الاسم واللقب" required>
</div>

<div class="mb-2">
<input class="form-control" id="phone" placeholder="رقم الهاتف" required>
</div>

<div class="mb-2">
<input class="form-control" id="state" placeholder="الولاية" required>
</div>

<div class="mb-2">
<select class="form-control" id="type">
<option>للمنزل</option>
<option>للمكتب</option>
</select>
</div>

<button class="btn btn-success w-100">
ارسال الطلب
</button>

</form>

</div>
</div>
</div>
</div>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center p-4">

Prime Man Boutique<br>

Email: mhmdbusniss@gmail.com<br>

Phone: 0676454829

</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- EMAILJS -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>

emailjs.init("xqmosYYqEUpu4Gb1u");

function order(product){

document.getElementById("product").value=product;

new bootstrap.Modal(document.getElementById('orderModal')).show();

}

document.getElementById("orderForm").addEventListener("submit",function(e){

e.preventDefault();

emailjs.send("service_33fq1pl","template_yirr7la",{

product:document.getElementById("product").value,

name:document.getElementById("name").value,

phone:document.getElementById("phone").value,

state:document.getElementById("state").value,

type:document.getElementById("type").value,

email:"mhmdbusniss@gmail.com"

})

.then(function(){

alert("تم ارسال الطلب بنجاح");

});

});

</script>

</body>
</html>
